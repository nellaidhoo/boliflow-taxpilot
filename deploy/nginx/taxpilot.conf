# Replace the example hostname and install a Cloudflare Origin CA certificate
# for that hostname before enabling Full (strict) at Cloudflare.
server {
    listen 80;
    listen [::]:80;
    server_name taxpilot.example.com;
    include /etc/nginx/snippets/cloudflare-realip.conf;
    include /etc/nginx/snippets/cloudflare-allow.conf;
    return 301 https://taxpilot.example.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name taxpilot.example.com;

    include /etc/nginx/snippets/cloudflare-realip.conf;
    include /etc/nginx/snippets/cloudflare-allow.conf;

    ssl_certificate     /etc/ssl/cloudflare/taxpilot-origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/taxpilot-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TaxPilotTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/taxpilot/current;
    index index.html;
    client_max_body_size 1m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location ^~ /v1/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location ^~ /health/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        access_log off;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
